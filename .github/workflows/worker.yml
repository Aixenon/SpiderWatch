name: Worker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            worker/ui/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run types
      - run: npm run check
      - run: npm run test:ui
      - run: npm run test:deploy
      - run: npm test
      - run: npm run build
      - run: npm run deploy -- --dry-run
        working-directory: .
