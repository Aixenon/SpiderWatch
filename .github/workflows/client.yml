name: SpiderWatch builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOEXPERIMENT: nojsonv2
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: go test ./...
        working-directory: client
      - run: go vet ./...
        working-directory: client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s client/scripts -p "test_*.py" -v
      - if: runner.os != 'Windows'
        run: sh -n client/scripts/install.sh
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.npm/spiderwatch-native-v1
          key: native-${{ runner.os }}-${{ hashFiles('client/go.mod', 'client/go.sum', 'client/scripts/bootstrap_nsis.py') }}
      - name: Validate release version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(tr -d '\r\n' < client/VERSION)
          python3 client/scripts/publish_github_release.py --validate-tag "v$version" > /dev/null
          if [ "$REF_TYPE" = tag ]; then
            tag_version=$(python3 client/scripts/publish_github_release.py --validate-tag "$REF_NAME")
            if [ "$version" != "$tag_version" ]; then
              echo 'Release tag must match client/VERSION' >&2
              exit 1
            fi
          fi
      - name: Build all clients and installers with the Cloudflare build entry
        run: npm run build:clients
      - run: python3 client/scripts/verify_builds.py --release-dir client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: spider-watch-release
          path: |
            client/dist/spider-watch-*
            client/dist/install.*
            client/dist/update-manifest.json
            client/dist/checksums.txt
            client/dist/release-info.json
          if-no-files-found: error
          retention-days: 7
  windows-installer:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spider-watch-release
          path: client/dist
      - name: Verify Linux-built installer, service, upgrade and uninstall
        shell: pwsh
        run: ./client/scripts/windows/test-installer.ps1 -Installer client/dist/spider-watch-windows-${{ matrix.arch }}-setup.exe
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, windows-installer]
    runs-on: ubuntu-latest
    concurrency:
      group: spider-watch-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: spider-watch-release
          path: client/dist
      - name: Verify draft assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 client/scripts/publish_github_release.py --tag "$RELEASE_TAG" --directory client/dist
